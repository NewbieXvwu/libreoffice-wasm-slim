name: repack-pruned-cdn-data
# 快车道：下载 ZetaOffice CDN 官方构建，解包 soffice.data 剪枝后重打包。
# 全程约 15-25 分钟，无需编译 LibreOffice。先跑通这个，再考虑 build-from-source。

on:
  workflow_dispatch:
    inputs:
      cdn_base:
        description: 'ZetaOffice CDN 基础 URL（结尾带 /）'
        default: 'https://cdn.zetaoffice.net/zetaoffice_latest/'
      skip_smoke:
        description: '跳过冒烟测试（仅调试用）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends brotli
          pip3 install fonttools python-docx
          npm i -g binaryen

      - name: 下载 ZetaOffice CDN 构建
        run: |
          mkdir -p lowa
          cd lowa
          for f in soffice.js soffice.wasm soffice.data soffice.data.js.metadata; do
            curl -fL --retry 3 -o "$f" "${{ inputs.cdn_base }}$f"
          done
          ls -lh

      - name: 记录原始体积
        run: |
          echo "## 原始体积" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          (cd lowa && ls -lh soffice.*) >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 解包 -> 剪枝 -> 注入中文字体 -> 重打包 -> 压缩
        run: bash scripts/repack_pipeline.sh lowa dist

      - name: 冒烟测试（fixture.docx 实转 PDF）
        if: ${{ !inputs.skip_smoke }}
        run: |
          python3 scripts/make_fixture.py fixture.docx
          mkdir -p stage/assets/vendor
          cp scripts/smoke_page.html stage/index.html
          cp scripts/smoke_office_thread.js stage/
          cp fixture.docx stage/
          cp -r lowa stage/lowa
          npm init -y >/dev/null
          npm i --no-fund --no-audit zetajs puppeteer
          # zetaHelper.js 在 zetajs 包内的 source/ 目录；若包结构变动导致 404，
          # 在 node_modules/zetajs 里确认真实路径后修正下一行
          cp -r node_modules/zetajs/source stage/assets/vendor/zetajs
          node scripts/serve_coop.js stage 8080 &
          SERVER_PID=$!
          sleep 1
          node scripts/smoke_test.mjs http://127.0.0.1:8080/
          kill $SERVER_PID

      - name: 冒烟失败时上传现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-debug
          path: stage/
          retention-days: 7

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: slim-${{ github.run_number }}
          name: slim-${{ github.run_number }}
          files: dist/*
